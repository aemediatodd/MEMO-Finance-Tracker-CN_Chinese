name: "MEMO – Finance Tracker 中文版"
version: "1.4.0-cn.1"
slug: "memo_finance_tracker"
description: "支持简体中文和人民币的本地优先 Home Assistant 记账工具"
url: "https://github.com/aemediatodd/MEMO-Finance-Tracker-CN_Chinese"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cash-multiple
panel_title: "MEMO 记账"
services:
  - mqtt:want
map:
  - data:rw
options:
  ai_enabled: false
  mqtt_host: "core-mosquitto"
  mqtt_port: 1883
  mqtt_base_topic: "memo"
  mqtt_discovery_prefix: "homeassistant"
  mqtt_currency: "¥"
  mqtt_publish_interval: 300
schema:
  ai_enabled: bool
  mqtt_host: str
  mqtt_port: port
  mqtt_username: "str?"
  mqtt_password: "password?"
  mqtt_base_topic: str
  mqtt_discovery_prefix: str
  mqtt_currency: str
  mqtt_publish_interval: int(10,)
